<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project: Library</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="display-books">
        <h2>Books in Library</h2>
        <button type="button" class="add-book-btn" id="add-book-btn">
          New Book
        </button>
        <div class="book-cards" id="book-cards"></div>
      </div>
      <div class="sidebar">
        <p class="credit">
          Photo by
          <a
            href="https://unsplash.com/@mzakatiura?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Mariia Zakatiura</a
          >
          on
          <a
            href="https://unsplash.com/photos/brown-wooden-book-shelves-with-books-t7zYZzO_CX0?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
            >Unsplash</a
          >
        </p>
      </div>
      <div class="add-book">
        <div class="pop-up-region">
          <form id="add-book-form" class="hidden">
            <div class="form-row">
              <label for="title">Title</label>
              <input type="text" id="title" name="title" required />
            </div>
            <div class="form-row">
              <label for="author-name">Author</label>
              <input type="text" id="author-name" name="author-name" required />
            </div>
            <div class="form-row">
              <label for="pages">Number of pages</label>
              <input type="number" id="pages" name="pages" required />
            </div>
            <div class="form-row">
              <label for="has-read">Have you read the book?</label>
              <input type="checkbox" id="has-read" name="has-read" />
            </div>
            <button type="submit" id="submit-btn">Add book</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
